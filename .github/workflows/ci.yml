name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline:
    name: offline gate (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The same pinned environment the installers are built from, so the
        # gate tests what ships. Unpinned installs drifted (starlette, anyio)
        # into deprecation warnings that filterwarnings=error turns into failures.
        # Streamlit and the dev tools are constrained to those pins; direct-URL
        # lines (the spaCy model wheel) are not valid constraints.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-runtime-py312.txt
          python -m pip install --no-deps -e .
          grep -v ' @ ' desktop/requirements-runtime-py312.txt > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -c "$RUNNER_TEMP/constraints.txt" streamlit pytest "ruff>=0.16" "mypy>=1.11"
          python -m pip check
      - name: Lint (ruff check)
        run: python -m ruff check .
      - name: Format (ruff format --check)
        run: python -m ruff format --check .
      - name: Types (mypy strict)
        run: python -m mypy core tools app desktop_backend
      - name: Compile
        run: python -m compileall -q core tools app tests desktop_backend scripts
      - name: Offline tests only (no model downloads, no cached models)
        run: python -m pytest -m "not model_integration"
      - name: Release-candidate consistency audit (registry/ledger/docs drift)
        run: python scripts/rc_audit.py

  desktop_frontend:
    name: desktop frontend (vitest + tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install (locked)
        working-directory: desktop
        run: npm ci
      - name: Unit tests
        working-directory: desktop
        run: npx vitest run
      - name: Type-check and production build
        working-directory: desktop
        run: npm run build

  model_integration:
    name: model tests (py3.12 / ubuntu)
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-runtime-py312.txt
          python -m pip install --no-deps -e .
          grep -v ' @ ' desktop/requirements-runtime-py312.txt > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -c "$RUNNER_TEMP/constraints.txt" stanza pytest
      - name: Download parser models (integration only)
        run: |
          python -m spacy download en_core_web_sm
          python -c "import stanza; stanza.download('en')"
      - name: Model-backed tests (explicit marker)
        run: python -m pytest -m model_integration