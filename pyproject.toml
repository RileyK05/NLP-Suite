[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-suite-ng"
# Single version for the whole product: the Python engine and the desktop
# application ship together, so this must equal desktop/package.json,
# tauri.conf.json and src-tauri/Cargo.toml. test_desktop_release_versions_stay_in_sync
# enforces it -- this file drifted to 0.1.0 while the desktop moved to 0.3.0
# because the test did not cover it.
version = "0.3.1"
description = "Ground-up rebuild of the NLP Suite: headless corpus NLP toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Riley Kehoe" }]
keywords = ["nlp", "corpus", "text-analysis", "linguistics", "digital-humanities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pandas>=2.2",
    "pyarrow>=14",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/RileyK05/NLP-Suite"
Downloads = "https://github.com/RileyK05/NLP-Suite/releases"
Documentation = "https://github.com/RileyK05/NLP-Suite/blob/main/docs/GET_STARTED.md"
Issues = "https://github.com/RileyK05/NLP-Suite/issues"

[project.optional-dependencies]
stanza = ["stanza>=1.7"]
converters = ["pdfminer.six>=20231228", "python-docx>=1.1", "striprtf>=0.0.26,<1"]
excel = ["openpyxl>=3.1"]
spacy = ["spacy>=3.7"]
plotly = ["plotly>=6.1.1"]
plotly-image = ["plotly>=6.1.1", "kaleido>=1.0", "packaging>=23"]
app = ["streamlit>=1.30", "plotly>=6.1.1"]
desktop = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
sentiment = ["vaderSentiment>=3.3"]
topics = ["gensim>=4.0"]
wordnet = ["nltk>=3.8"]
embeddings = ["transformers>=4.0"]
wordcloud = ["wordcloud>=1.9"]
figures = ["matplotlib>=3.8", "seaborn>=0.13"]
all = [
    "nlp-suite-ng[stanza]",
    "nlp-suite-ng[converters]",
    "nlp-suite-ng[excel]",
    "nlp-suite-ng[spacy]",
    "nlp-suite-ng[plotly]",
    "nlp-suite-ng[plotly-image]",
    "nlp-suite-ng[app]",
    "nlp-suite-ng[desktop]",
    "nlp-suite-ng[sentiment]",
    "nlp-suite-ng[topics]",
    "nlp-suite-ng[wordnet]",
    "nlp-suite-ng[embeddings]",
    "nlp-suite-ng[wordcloud]",
    "nlp-suite-ng[figures]",
]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "mypy>=1.11",
]

[project.scripts]
nlp-doctor = "tools.doctor:main"
nlp-suite = "tools.unified:main"

[tool.setuptools.packages.find]
include = ["core*", "tools*", "app*", "desktop_backend*"]

# ---------------------------------------------------------------------------
# Ruff â€” strict. There is no legacy backlog here, so no legacy suppressions.
# The rules below are the mechanical enforcement for invariants R2, R4, R6,
# R11 in docs/ARCHITECTURE.md section 10.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["out", "legacy", "assets", "scripts", "desktop/.toolchain", "desktop/node_modules", "desktop/src-tauri/target", "desktop/src-tauri/gen"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear  (B006 mutable default = R6)
    "T20",      # print/debug in library code (R4)
    "PL",       # pylint port
    "S",        # bandit   (S307 eval, S602 shell=True, S105 secrets = R11)
    "SIM",      # simplify
    "RUF",
]

# Nothing is globally ignored except rules that genuinely fight clarity in
# research code. Every rule named in ARCHITECTURE.md section 10 stays on.
ignore = [
    "E501",     # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# CLIs and the Streamlit app talk to a human; the core library does not.
"tools/**/*.py" = ["T201", "F401", "I001", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
"core/profiler/executor.py" = ["PLC0415"]
# The one module whose whole content is text shown to a reader. It carries the
# typography that belongs in an interface -- "TF-IDF" with an en dash,
# "Kruskal-Wallis", "Significance level (alpha)" -- which RUF001 reads as
# homoglyphs. That check earns its keep on identifiers and code; here it would
# only push display text back to ASCII.
"core/profiler/labels.py" = ["RUF001"]
"tests/test_labels.py" = ["RUF001"]
"scripts/**/*.py" = ["T201", "F401", "I001", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
"app/**/*.py" = ["T201"]
# Desktop composition lazily imports model libraries in worker processes;
# the worker loop's stdout is a job protocol, not human chatter.
"desktop_backend/runner.py" = ["PLC0415", "PLR0915", "T201"]
# Live analysis imports the engine and the parser backends lazily: the
# server must start without paying for spaCy, and most sessions never parse.
"desktop_backend/live.py" = ["PLC0415"]
"desktop_backend/archives.py" = ["PLR0912"]
"desktop_backend/tables.py" = ["PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR0915"]
# API route registration is a declarative composition root; stdout carries the native handshake.
"desktop_backend/server.py" = ["PLC0415", "PLR0915", "T201"]
"core/analysis/*.py" = ["B007", "B023", "E741", "F401", "F811", "F841", "I001", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF003", "RUF022", "S324", "SIM108", "SIM113"]
# lexical_diversity samples with a SEEDED PRNG for reproducible vocd-D (R6);
# it is statistics, not cryptography, so S311 does not apply to this file.
"core/analysis/lexical_diversity.py" = ["S311"]
# chartspec._prepare_by_kind / plotters.build_figure dispatch on chart kind —
# one branch per kind is the flat, readable shape; a dispatch table of
# Result-returning closures would hide the per-kind contract.
"core/viz/*.py" = ["PLC0415", "PLR0912", "PLR0911", "PLR0915", "F401", "PLR2004"]
"core/data/*.py" = ["I001", "RUF022", "RUF046", "SIM108", "PLR0912"]
"core/pcace/*.py" = ["I001"]
# universal_to_penn is a linguistic dispatch table (Universal tag -> Penn tag),
# not control-flow complexity: it is one flat set of tag rules. PLR0911/PLR0912
# count its returns as branches. Scoped to this one file; everywhere else the
# design-metric rules stay on.
"core/conll/normalize.py" = ["PLR0911", "PLR0912"]
# envelope from_dict validates untrusted JSON and branch-count is inherent.
"core/artifacts/envelope.py" = ["PLR0912"]
# compare_runs validates artifacts, envs, and files — branch count is
# inherent to the reviewer-mandated checks.
"core/compare.py" = ["PLR0912"]
# status() maps every asset state (unknown/unstamped/missing/corrupt/ok) to
# a distinct Result — one return per state is the honest shape.
"core/assets/registry.py" = ["PLR0911"]
# OutputWriter's constructor validates the run directory against inputs.
"core/io/writer.py" = ["PLR0913"]
# Pipelines: PLC0415 for lazy model loading (R1), PLR0911/PLR0912 for builders.
"core/pipelines/*.py" = ["PLC0415", "PLR0911", "PLR0912"]
# Word-frequency tool has many early returns for validation.
"core/analysis/conll_wordlist.py" = ["PLR0911"]
"tools/conll_wordlist.py" = ["PLR0911", "PLR0912"]
# Raster wordcloud: load_mask and wordcloud_image are flat validation
# chains (one distinct diagnostic per bad input, mirroring the legacy
# wordclouds_util failure surface) and the render call exposes the
# legacy GUI knobs directly — argument/return counts are inherent.
"core/viz/wordcloud_gephi.py" = ["PLR0911", "PLR0913", "PLR0917"]
# File ops are small dispatch-heavy utilities; branch counts are inherent.
"core/file_ops/*.py" = ["PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLW2901", "RUF005", "RUF034", "S311", "SIM108"]
"tests/**/*.py" = [
    "T201",     # pytest output
    "S101",     # assert is the point of a test
    "PLR2004",  # magic numbers in assertions
    "PLR0915",  # a test may be long
    "PLC0415",  # test-local imports keep optional deps out of collection
]
"conftest.py" = [
    "PLC0415",  # probe imports run at test time, not collection time
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

# ---------------------------------------------------------------------------
# mypy â€” strict. No public function may return Optional[T] as a failure
# signal (R7); failure is Result[T].
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
exclude = ["out/", "legacy/"]

# pandas ships no inline types and pandas-stubs is not a dependency here.
[[tool.mypy.overrides]]
module = ["pandas.*", "gensim.*", "vaderSentiment.*", "stanza.*", "spacy.*", "streamlit.*", "plotly.*", "numpy.*", "scipy.*", "sklearn.*", "nltk.*", "pdfminer.*", "docx.*", "striprtf.*", "wordcloud.*", "openpyxl.*", "PIL.*", "matplotlib.*", "seaborn.*", "networkx.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# model_integration needs optional NLP packages/models/data — excluded from the
# ordinary gate per the marker docs. Run them explicitly with:
#   python -m pytest -m model_integration
# faulthandler_timeout dumps all-thread tracebacks if any test exceeds 120s,
# so a hang is diagnosable instead of silent (no plugin needed — pytest core).
addopts = "-q --strict-markers -m 'not model_integration'"
faulthandler_timeout = 120
filterwarnings = ["error"]
markers = [
    "offline: pure offline unit test (default assumption; never needs models or network)",
    "model_integration: needs a locally installed parser model; excluded from ordinary CI",
]
